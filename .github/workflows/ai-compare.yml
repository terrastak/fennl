# The AI model comparison (phase E7; import-quality/aiCompare.ts): reads the quality test set's
# photos, pages, screenshots and PDFs (and, if chosen, its web pages with their recipe data left
# out, phase E8) with the cheaper model alone, the stronger model alone, and the cheaper model with
# a second look by the stronger one when needed, then reports accuracy and cost side by side on
# the run's summary page. It calls the real API, so it costs money (about $6 for the photos with
# all three ways, about $1.50 with only Fennl's way; about another dollar for the web pages): it
# runs only when started by hand (Actions › AI model comparison › Run workflow). Needs the
# repository secret ANTHROPIC_API_KEY (docs/setup/e7-ai-import.md).
name: AI model comparison

on:
  workflow_dispatch:
    inputs:
      models:
        description: "The cheaper and the stronger model, separated by a comma (blank: Fennl's own)"
        required: false
        default: ""
      sets:
        description: "What to read: photos (cards, pages, screenshots, PDFs), web (pages without their recipe data), text (pasted text), or all"
        type: choice
        options:
          - photos
          - web
          - text
          - all
        default: photos
      ways:
        description: "all: the cheaper model alone, the stronger alone, and Fennl's way (about $6 for the photos). fennl: only Fennl's way (about $1.50)"
        type: choice
        options:
          - all
          - fennl
        default: all

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    # Everything, read all three ways, took longer than an hour on 2026-10-22 and was cut off with
    # nothing kept. Now samples are read three at a time, no new one is started after 90 minutes
    # (the report then says how many were read), and the answers are saved after every sample.
    timeout-minutes: 120
    env:
      AI_COMPARE_MINUTES: "90"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_MODELS: ${{ inputs.models }}
      AI_COMPARE_SETS: ${{ inputs.sets }}
      AI_COMPARE_WAYS: ${{ inputs.ways }}
      # The private samples (whole printed web pages, kept out of this public repository; owner's
      # choice 2026-10-21): read from a private repository when this token is set
      # (docs/setup/private-test-samples.md). Without it, they're left out.
      TEST_SAMPLES_TOKEN: ${{ secrets.TEST_SAMPLES_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Private samples
        if: env.TEST_SAMPLES_TOKEN != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.TEST_SAMPLES_REPO || 'terrastak/fennl-test-samples' }}
          token: ${{ secrets.TEST_SAMPLES_TOKEN }}
          path: test-pdfs
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Compare
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::The ANTHROPIC_API_KEY repository secret isn't set (docs/setup/e7-ai-import.md)."
            exit 1
          fi
          if [ -z "$AI_MODELS" ]; then unset AI_MODELS; fi
          if [ -d test-pdfs ]; then
            export PRIVATE_SAMPLES=1
          else
            echo "::notice::The private samples aren't read: the TEST_SAMPLES_TOKEN secret isn't set (docs/setup/private-test-samples.md)."
          fi
          npm run ai:compare
      # How Fennl arranges a recipe's photos (phase D4): the owner's recipes with several photos,
      # from the private samples. A fraction of a cent.
      - name: Photo order
        if: env.TEST_SAMPLES_TOKEN != '' && (inputs.sets == 'photos' || inputs.sets == 'all')
        run: |
          if [ -z "$AI_MODELS" ]; then unset AI_MODELS; fi
          npm run ai:photo-order
      - name: Report
        if: always()
        run: |
          if [ -f import-quality/ai-report.md ]; then
            cat import-quality/ai-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f import-quality/photo-order-report.md ]; then
            cat import-quality/photo-order-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      # Every answer the AI gave, so the second-look rules can be re-checked on them, and the run
      # re-scored when a correct answer changes, for free (npm run ai:replay, npm run
      # ai:rescore). Kept with the run for 90 days (owner's request 2026-10-21).
      - name: Keep the answers
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-answers
          path: |
            import-quality/ai-answers.json
            import-quality/ai-report.md
            import-quality/photo-order-report.md
          if-no-files-found: ignore
          retention-days: 90
