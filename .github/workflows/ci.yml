# Checks every pull request, gives it a preview link, and deploys main to production.
#
# - check:   format, lint, typecheck, migration check, unit tests, browser tests.
# - preview: (pull requests from this repo) applies migrations to the staging database, uploads a
#            version of the "fennl-preview" Worker with a per-PR alias, checks it responds, and
#            comments the link on the PR.
# - deploy:  (pushes to main) applies migrations to the production database, then deploys the
#            "fennl" Worker to the APP_HOSTNAME custom domain.
#
# Migrations run before the new code goes live, so each migration must keep working with the code
# that is already running (add things first; remove old columns only in a later change).
#
# Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and the variable
# APP_HOSTNAME (see docs/setup/a1-cloudflare-and-github.md), plus the email and sign-in settings
# in docs/setup/b2-email-and-sign-in.md (RESEND_API_KEY, EMAIL_FROM, GOOGLE_*, APPLE_*), and the
# admin area settings in docs/setup/b4a-admin-access.md (ADMIN_HOSTNAME, ACCESS_*, ADMIN_ALERT_EMAIL,
# CF_ACCESS_CLIENT_ID/SECRET).
#
# Worker secrets are written to a temporary file and uploaded with each version (--secrets-file).
# BETTER_AUTH_SECRET is generated here, never stored in GitHub: production creates it once and
# keeps it; previews get a new one on every push (preview sign-ins don't need to survive pushes).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  preview:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ENV: preview
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD_PREVIEW }}
      ADMIN_ALERT_EMAIL: ${{ vars.ADMIN_ALERT_EMAIL }}
      # Lets CI's own checks past Cloudflare Access (docs/setup/b4a-admin-access.md).
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the preview Worker
        run: npm run build
      - name: Create the database if it doesn't exist yet
        shell: bash
        run: |
          set -euo pipefail
          # The database name comes from the built config (wrangler.jsonc), so it's never repeated here.
          name=$(node -p 'require("./dist/fennl/wrangler.json").d1_databases[0].database_name')
          if npx wrangler d1 info "$name" > /dev/null 2>&1; then
            echo "Database $name exists."
          else
            echo "Creating database $name."
            npx wrangler d1 create "$name"
          fi
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Create the audit log bucket and lock it
        shell: bash
        run: |
          set -euo pipefail
          # Write-once copy of the admin audit log: objects can't be changed or deleted for a year
          # (worker/admin/audit-bucket-lock.json). The name comes from the built config.
          bucket=$(node -p 'require("./dist/fennl/wrangler.json").r2_buckets[0].bucket_name')
          if npx wrangler r2 bucket info "$bucket" > /dev/null 2>&1; then
            echo "Bucket $bucket exists."
          else
            echo "Creating bucket $bucket."
            npx wrangler r2 bucket create "$bucket"
          fi
          npx wrangler r2 bucket lock set "$bucket" --file worker/admin/audit-bucket-lock.json --force
      - name: Prepare preview secrets
        shell: bash
        run: |
          set -euo pipefail
          # Google and Apple only accept sign-ins at addresses registered with them, and preview
          # links change with every pull request, so previews offer email and password only.
          node scripts/worker-secrets.mjs "$RUNNER_TEMP/secrets.json" \
            RESEND_API_KEY EMAIL_FROM ACCESS_TEAM_DOMAIN ACCESS_AUD ADMIN_ALERT_EMAIL --new-auth-secret
          if [ -z "${RESEND_API_KEY:-}" ] || [ -z "${EMAIL_FROM:-}" ]; then
            echo "::warning::RESEND_API_KEY or EMAIL_FROM isn't set, so this preview can't send sign-up emails (docs/setup/b2-email-and-sign-in.md)."
          fi
      - name: Upload preview version
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          alias="pr-${PR_NUMBER}"
          secrets="$RUNNER_TEMP/secrets.json"
          # Versions can only be uploaded to a Worker that exists, so the very first run creates it.
          if ! npx wrangler deployments list > /dev/null 2>&1; then
            echo "The preview Worker doesn't exist yet; creating it with a first deploy."
            npx wrangler deploy --message "Create preview Worker" --secrets-file "$secrets"
          fi
          out=$(npx wrangler versions upload --preview-alias "$alias" --message "PR #${PR_NUMBER} at ${HEAD_SHA:0:7}" --secrets-file "$secrets" 2>&1 | tee /dev/stderr)
          url=$(grep -oE "https://${alias}-[a-z0-9.-]+\.workers\.dev" <<< "$out" | head -n 1 || true)
          if [ -z "$url" ]; then
            echo "::error::Couldn't find the preview link in Wrangler's output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.json"
      - name: Check the preview responds
        shell: bash
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: |
          set -uo pipefail
          # Once the preview Worker is behind Cloudflare Access, CI shows its service token.
          access=()
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            access=(-H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET")
          fi
          for attempt in $(seq 1 30); do
            if [ "$(curl -fsS --max-time 10 "${access[@]}" "$URL/api/health" | jq -r '.status' 2> /dev/null)" = "ok" ]; then
              echo "Preview is up: $URL"
              exit 0
            fi
            echo "Attempt $attempt: not ready yet"
            sleep 10
          done
          echo "::error::The preview at $URL did not answer /api/health within 5 minutes."
          exit 1
      - name: Comment the preview link on the pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          set -euo pipefail
          body=$(printf '%s\n' \
            "**Preview:** $URL" \
            "" \
            "Built from ${HEAD_SHA:0:7}. This link updates on every push to this pull request." \
            "Previews use the separate \`fennl-preview\` Worker and never touch production data.")
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$body"
          echo "### Preview: $URL" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
      ADMIN_HOSTNAME: ${{ vars.ADMIN_HOSTNAME }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD_ADMIN }}
      ADMIN_ALERT_EMAIL: ${{ vars.ADMIN_ALERT_EMAIL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
      APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
    steps:
      - name: Require APP_HOSTNAME and email settings
        run: |
          if [ -z "$APP_HOSTNAME" ]; then
            echo "::error::The APP_HOSTNAME repository variable is not set, so production has no address."
            exit 1
          fi
          # Without email nobody can confirm an account, so don't ship sign-up half working.
          if [ -z "$RESEND_API_KEY" ] || [ -z "$EMAIL_FROM" ]; then
            echo "::error::Set the RESEND_API_KEY secret and the EMAIL_FROM variable first (docs/setup/b2-email-and-sign-in.md)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build for production
        run: npm run build
      - name: Create the database if it doesn't exist yet
        shell: bash
        run: |
          set -euo pipefail
          # The database name comes from the built config (wrangler.jsonc), so it's never repeated here.
          name=$(node -p 'require("./dist/fennl/wrangler.json").d1_databases[0].database_name')
          if npx wrangler d1 info "$name" > /dev/null 2>&1; then
            echo "Database $name exists."
          else
            echo "Creating database $name."
            npx wrangler d1 create "$name"
          fi
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Create the audit log bucket and lock it
        shell: bash
        run: |
          set -euo pipefail
          # Write-once copy of the admin audit log: objects can't be changed or deleted for a year
          # (worker/admin/audit-bucket-lock.json). The name comes from the built config.
          bucket=$(node -p 'require("./dist/fennl/wrangler.json").r2_buckets[0].bucket_name')
          if npx wrangler r2 bucket info "$bucket" > /dev/null 2>&1; then
            echo "Bucket $bucket exists."
          else
            echo "Creating bucket $bucket."
            npx wrangler r2 bucket create "$bucket"
          fi
          npx wrangler r2 bucket lock set "$bucket" --file worker/admin/audit-bucket-lock.json --force
      - name: Prepare production secrets
        shell: bash
        run: |
          set -euo pipefail
          # BETTER_AUTH_SECRET is made once; every sign-in session depends on it, so it's never
          # replaced. If the list can't be read, stop rather than risk replacing it.
          # Wrangler may print notes before the JSON, so start at the first line that opens a list.
          existing=$(npx wrangler secret list --format json | sed -n '/^\[/,$p')
          if ! jq -e 'type == "array"' <<< "$existing" > /dev/null; then
            echo "::error::Couldn't read the production Worker's secrets, so not deploying."
            exit 1
          fi
          extra=()
          if ! jq -e 'any(.[]; .name == "BETTER_AUTH_SECRET")' <<< "$existing" > /dev/null; then
            echo "Creating BETTER_AUTH_SECRET for production."
            extra+=(--new-auth-secret)
          fi
          node scripts/worker-secrets.mjs "$RUNNER_TEMP/secrets.json" \
            RESEND_API_KEY EMAIL_FROM GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
            APPLE_CLIENT_ID APPLE_TEAM_ID APPLE_KEY_ID APPLE_PRIVATE_KEY \
            ACCESS_TEAM_DOMAIN ACCESS_AUD ADMIN_ALERT_EMAIL "${extra[@]}"
      - name: Deploy
        run: npx wrangler deploy --message "main at ${GITHUB_SHA:0:7}" --secrets-file "$RUNNER_TEMP/secrets.json"
      - name: Remove the secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.json"
      - name: Check production responds
        shell: bash
        run: |
          set -uo pipefail
          url="https://$APP_HOSTNAME"
          # The first deploy to a new hostname can take a few minutes while DNS and the certificate are set up.
          for attempt in $(seq 1 60); do
            if [ "$(curl -fsS --max-time 10 "$url/api/health" | jq -r '.status' 2> /dev/null)" = "ok" ]; then
              echo "Production is up: $url"
              echo "### Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt: not ready yet"
            sleep 10
          done
          echo "::error::$url did not answer /api/health within 10 minutes."
          exit 1
